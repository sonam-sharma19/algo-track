<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoTrack — DSA Progress Tracker</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            Algo<span>Track</span>
        </div>

        <div class="nav-links">
            <a href="#">Dashboard</a>
            <a href="topics.html">Topics</a>
            <a href="#">Progress</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main>

        <!-- Hero Section -->
        <section class="hero">
            
            <p class="tag">DSA PROGRESS TRACKER</p>

            <h1>
                Track your DSA journey.
            </h1>

            <p class="hero-text">
                Practice consistently, track your progress,
                and become better at problem solving.
            </p>

            <button class="start-btn">
                Start Tracking →
            </button>

        </section>
        <section class="progress-section">
            <p class="section-label">YOUR PROGRESS</p>

            <h2>Keep Track. Keep Growing.</h2>

            <div class="progress-cards">

            <div class="progress-card">
                <h3>Problems Solved</h3>
                <p>0</p>
            </div>

            <div class="progress-card">
                <h3>Topics Completed</h3>
                <p>0</p>
            </div>

            <div class="progress-card">
                <h3>Current Streak</h3>
                <p>0 Days</p>
            </div>

            </div>
        </section>
    </main>
</body>
</html>
